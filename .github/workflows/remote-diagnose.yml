name: Remote Diagnose (read-only)

# Read-only inspection of the live server. Writes nothing, activates nothing.
# Output is deliberately compact: no page dumps, only the facts needed to tell
# why the front end renders unstyled.

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Inspect rudraspirit.com
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST || '217.21.74.44' }}
      SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
      SSH_USER: ${{ secrets.SSH_USER || 'u362580417' }}
      REMOTE_PATH: "/home/u362580417/domains/rudraspirit.com/public_html/app/public"

    steps:
      - name: Setup SSH Authentication
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Backups available for restore
        run: |
          timeout 120 ssh -o StrictHostKeyChecking=accept-new -p $SSH_PORT $SSH_USER@$SSH_HOST '
            echo "--- ~/deploy-backups ---"; ls -1 ~/deploy-backups/ 2>/dev/null | tail -20 || echo "NONE"
            echo "--- newest backup contents ---"
            b=$(ls -1dt ~/deploy-backups/*/ 2>/dev/null | head -1)
            if [ -n "$b" ]; then echo "newest: $b"; ls -la "$b" 2>/dev/null | head -15; else echo "NONE"; fi
          ' || echo "STEP FAILED"

      - name: Active plugins
        run: |
          timeout 150 ssh -p $SSH_PORT -o StrictHostKeyChecking=accept-new $SSH_USER@$SSH_HOST "
            export PATH=/opt/alt/php83/usr/bin:\$PATH; cd $REMOTE_PATH
            timeout 90 wp plugin list --status=active --field=name 2>&1 | tr '\n' ' '
            echo; echo '--- theme ---'
            timeout 60 wp theme list --status=active --field=name 2>&1 | tr '\n' ' '
          " || echo "STEP FAILED"

      - name: Stylesheets the home page actually links
        run: |
          BODY=$(mktemp)
          code=$(curl -s -o "$BODY" -w '%{http_code}' https://rudraspirit.com/)
          echo "HTTP $code, $(wc -c < "$BODY") bytes"
          echo "--- stylesheet hrefs ---"
          grep -o -i "<link[^>]*rel=['\"]stylesheet['\"][^>]*>" "$BODY" \
            | grep -o "href=['\"][^'\"]*['\"]" | sed "s/href=//; s/['\"]//g" | sed 's/?ver=.*//' | sort -u
          echo "--- counts ---"
          echo "stylesheet links: $(grep -c -i "rel=['\"]stylesheet['\"]" "$BODY")"
          echo "vemus theme css refs: $(grep -c 'themes/vemus' "$BODY")"
          echo "elementor css refs: $(grep -c 'elementor' "$BODY")"
          echo "leaking shortcodes: $(grep -o '\[[a-z0-9_-]\+[^]]*\]' "$BODY" | grep -iE 'form|gallery|shortcode' | head -3)"

      - name: Can the browser fetch the theme stylesheets
        run: |
          for u in \
            "https://rudraspirit.com/wp-content/themes/vemus/style.css" \
            "https://rudraspirit.com/wp-content/themes/vemus-child/style.css" \
            "https://rudraspirit.com/wp-content/themes/vemus/assets/css/app.css"; do
            echo "$(curl -s -o /dev/null -w '%{http_code} %{size_download}b' "$u")  $u"
          done

      - name: Theme stylesheet permissions on disk
        run: |
          timeout 120 ssh -p $SSH_PORT -o StrictHostKeyChecking=accept-new $SSH_USER@$SSH_HOST "
            cd $REMOTE_PATH/wp-content/themes
            ls -la vemus-child/style.css vemus/style.css 2>&1
            echo '--- dir perms ---'
            ls -ld vemus vemus-child 2>&1
          " || echo "STEP FAILED"
