name: Remote Diagnose (read-only)

# Read-only. Writes nothing.
#
# Ruled out so far: MIME type, markup structure, links outside <head>, output
# before <!DOCTYPE>, User-Agent variance, HTTP caching, service workers
# (confirmed by an Incognito test that still rendered unstyled).
#
# Untested until now: content compression. Every earlier curl omitted
# Accept-Encoding, so the server replied uncompressed and looked perfect. A
# browser always requests gzip/br. If the compressed variant is corrupt, the
# browser discards the CSS and JS while images - already-compressed binaries
# that gzip leaves alone - keep loading. That is precisely the split reported.

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Compressed vs uncompressed asset delivery
    runs-on: ubuntu-latest
    env:
      CSS: "https://rudraspirit.com/wp-content/themes/vemus-child/style.css"
      MAIN: "https://rudraspirit.com/wp-content/themes/vemus/assets/css/vemus-main.css"
      HOME: "https://rudraspirit.com/"

    steps:
      - name: Headers under each Accept-Encoding
        run: |
          for enc in "identity" "gzip" "br" "gzip, deflate, br"; do
            echo "=== Accept-Encoding: $enc ==="
            curl -sI -H "Accept-Encoding: $enc" "$CSS" \
              | grep -iE 'HTTP/|content-encoding|content-type|content-length|vary|server' || true
            echo
          done

      - name: Does the gzip variant actually decompress
        run: |
          echo "--- raw bytes with Accept-Encoding: gzip ---"
          curl -s -H "Accept-Encoding: gzip" -o /tmp/gz.bin "$CSS"
          echo "size: $(wc -c < /tmp/gz.bin)"
          echo "magic:"; od -An -tx1 -N4 /tmp/gz.bin
          if gzip -t /tmp/gz.bin 2>/dev/null; then
            echo "gzip integrity: OK"
            echo "decompressed head:"; gunzip -c /tmp/gz.bin | head -c 100; echo
          else
            echo "gzip integrity: FAILED - body is not valid gzip"
            echo "first 100 bytes as text:"; head -c 100 /tmp/gz.bin; echo
          fi

      - name: What curl --compressed gets (closest to a browser)
        run: |
          for u in "$CSS" "$MAIN"; do
            echo "=== $u ==="
            curl -s --compressed -o /tmp/c.out -w 'http=%{http_code} type=%{content_type} size=%{size_download}\n' "$u"
            echo "first 100 chars:"; head -c 100 /tmp/c.out; echo
            echo "looks like css: $(head -c 2000 /tmp/c.out | grep -c -E '\{|/\*')"
            echo
          done

      - name: Home page HTML under compression
        run: |
          curl -s --compressed -o /tmp/h.html "$HOME"
          echo "bytes: $(wc -c < /tmp/h.html)"
          echo "stylesheet links: $(grep -c -i 'rel=.stylesheet.' /tmp/h.html || true)"
          echo "first 80 chars:"; head -c 80 /tmp/h.html; echo

      - name: Brotli variant specifically
        run: |
          curl -s -H "Accept-Encoding: br" -o /tmp/br.bin "$CSS"
          echo "size: $(wc -c < /tmp/br.bin)"
          echo "magic:"; od -An -tx1 -N4 /tmp/br.bin
          echo "first 80 bytes as text:"; head -c 80 /tmp/br.bin; echo
