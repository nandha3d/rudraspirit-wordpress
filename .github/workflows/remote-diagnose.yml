name: Remote Diagnose (read-only)

# Read-only inspection of the live server. Runs nothing that writes, deletes,
# activates or deactivates anything - it only reports state so a fix can be
# based on facts instead of guesswork.

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Inspect rudraspirit.com
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST || '217.21.74.44' }}
      SSH_PORT: ${{ secrets.SSH_PORT || '65002' }}
      SSH_USER: ${{ secrets.SSH_USER || 'u362580417' }}
      REMOTE_PATH: "/home/u362580417/domains/rudraspirit.com/public_html/app/public"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Authentication
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Available backups on the server
        run: |
          timeout 120 ssh -o StrictHostKeyChecking=accept-new -p $SSH_PORT $SSH_USER@$SSH_HOST '
            echo "=== ~/deploy-backups ==="; ls -la ~/deploy-backups/ 2>/dev/null | tail -30 || echo "(none)"
            echo; echo "=== wp-content.tar.gz candidates in home ==="
            ls -la ~/*.tar.gz ~/backups/*.tar.gz 2>/dev/null || echo "(none)"
          ' || echo "step failed, continuing"

      - name: Active plugins and theme
        run: |
          timeout 180 ssh -p $SSH_PORT -o StrictHostKeyChecking=accept-new $SSH_USER@$SSH_HOST "
            export PATH=/opt/alt/php83/usr/bin:\$PATH; cd $REMOTE_PATH
            echo '=== active plugins ==='; timeout 90 wp plugin list --status=active --fields=name,status,version 2>&1 | head -40
            echo; echo '=== theme ==='; timeout 60 wp theme list --fields=name,status,version 2>&1 | head -20
          " || echo "step failed, continuing"

      - name: Rendered home page shape
        run: |
          BODY=$(mktemp)
          curl -s -o "$BODY" https://rudraspirit.com/ || true
          echo "bytes: $(wc -c < "$BODY")"
          echo "stylesheet <link> tags: $(grep -o -i '<link[^>]*stylesheet[^>]*>' "$BODY" | wc -l)"
          echo "script tags: $(grep -o -i '<script' "$BODY" | wc -l)"
          echo "wp-content asset refs: $(grep -o 'wp-content/[^\"'\'' ]*' "$BODY" | wc -l)"
          echo "raw shortcodes leaking: $(grep -o '\[[a-z0-9_-]*form[^]]*\]' "$BODY" | head -5)"
          echo; echo "=== first 40 lines of <head> ==="
          sed -n '1,40p' "$BODY"

      - name: Live vs repo file differences (vemus-addon and vemus-child)
        run: |
          timeout 180 ssh -p $SSH_PORT -o StrictHostKeyChecking=accept-new $SSH_USER@$SSH_HOST "
            cd $REMOTE_PATH/wp-content
            find themes/vemus-child plugins/vemus-addon -type f -name '*.php' -newermt '2026-07-01' -printf '%TY-%Tm-%Td %p\n' 2>/dev/null | sort | tail -40
          " || echo "step failed, continuing"

      - name: Recent PHP errors
        run: |
          timeout 120 ssh -p $SSH_PORT -o StrictHostKeyChecking=accept-new $SSH_USER@$SSH_HOST "
            cd $REMOTE_PATH
            for f in error_log wp-content/debug.log ../error_log ../../error_log; do
              if [ -f \"\$f\" ]; then echo \"=== \$f (tail 25) ===\"; tail -25 \"\$f\"; fi
            done
          " || echo "step failed, continuing"
